[package]
name = "podpot"
version = "0.1.0"
edition = "2024"
description = "Panel web para gestionar las quadlets de Podman del systemd de usuario (rootless)."
license = "MIT"
publish = false

# El backend vive en su propio crate (`backend/`), no en la raíz del repositorio: el
# panel (`frontend/`) es otra pieza y no comparte dependencias pesadas con él.
#
# Las versiones están fijadas a las que ya están en la caché de Cargo de esta
# máquina (~/.cargo/registry): el repositorio tiene que poder compilarse sin
# conexión, así que se resuelven contra la caché y no por reputación.
[dependencies]
axum = { version = "0.8.9", features = ["macros", "json", "tokio"] }
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
dotenvy = "0.15.7"
# El trait `SystemdClient` tiene métodos `async` y se usa como objeto
# (`Arc<dyn SystemdClient>`) para inyectar el doble en las pruebas: `async-trait`
# es lo que lo hace compatible con el despacho dinámico.
async-trait = "0.1.92"

# El panel estático (`PODPOT_STATIC_DIR`) se sirve desde el propio backend con
# `ServeDir`/`ServeFile`: sólo la feature `fs`, que es la que trae esos dos.
# `tower-http` sin features por defecto para no arrastrar compresión ni
# trazado, que aquí no se usan.
tower-http = { version = "0.6.11", default-features = false, features = ["fs"] }

# SQLite con `runtime-tokio` (el runtime de la app), `sqlite` (el driver),
# `migrate` (el migrador embebido) y `macros` (`sqlx::migrate!()` lee
# `backend/migrations/` en tiempo de compilación).
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# D-Bus directo contra `org.freedesktop.systemd1` del bus **de usuario**.
# `default-features = false` deja fuera el transporte `async-io` y deja sólo el
# de tokio, que es el runtime de este proceso: con los dos encendidos se compila
# un transporte que nunca se usa.
zbus = { version = "5.14.0", default-features = false, features = ["tokio"] }

# `StreamExt::next()` sobre el `SignalStream` con el que se espera el fin de un
# job de systemd (`JobRemoved`). Es un método de trait, así que la dependencia
# transitiva de `zbus` no basta: el trait tiene que estar en el ámbito por su
# nombre.
futures-util = "0.3.34"

[dev-dependencies]
# `ServiceExt::oneshot` es lo que permite llamar al router sin abrir un puerto.
tower = { version = "0.5.3", features = ["util"] }
# Leer el cuerpo de una respuesta en una prueba.
http-body-util = "0.1"
# Base de datos temporal por prueba: el arranque no crea directorios, así que las
# pruebas le dan uno que ya existe y que se limpia al soltarlo.
tempfile = "3"
# `libc::kill` es lo que permite mandar `SIGTERM` al proceso de verdad en la
# prueba de arranque: `Child::kill` sólo manda `SIGKILL`, y con `SIGKILL` no se
# puede medir un apagado ordenado.
libc = "0.2"

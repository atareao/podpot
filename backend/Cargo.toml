[package]
name = "podpot"
version = "0.2.1"
edition = "2024"
description = "Panel web para gestionar las quadlets de Podman del systemd de usuario (rootless)."
license = "MIT"
publish = false

# El backend vive en su propio crate (`backend/`), no en la raíz del repositorio: el
# panel (`frontend/`) es otra pieza y no comparte dependencias pesadas con él.
#
# Las versiones están fijadas a las que ya están en la caché de Cargo de esta
# máquina (~/.cargo/registry): el repositorio tiene que poder compilarse sin
# conexión, así que se resuelven contra la caché y no por reputación.
[dependencies]
# El SSE no necesita feature: `axum::response::sse` (`Sse`, `Event`, `KeepAlive`)
# es parte del crate en 0.8.9 —`pub mod sse` sin `cfg`— y lo único que pedía la
# feature `tokio` (que ya está) es el `KeepAliveStream` de los latidos. Tampoco se
# añade ninguna caja de streams: el flujo se compone con `futures-util`, que ya
# está por el `StreamExt` del cliente de D-Bus.
axum = { version = "0.8.9", features = ["macros", "json", "tokio"] }
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
dotenvy = "0.15.7"
# El trait `SystemdClient` tiene métodos `async` y se usa como objeto
# (`Arc<dyn SystemdClient>`) para inyectar el doble en las pruebas: `async-trait`
# es lo que lo hace compatible con el despacho dinámico.
async-trait = "0.1.92"

# El panel estático (`PODPOT_STATIC_DIR`) se sirve desde el propio backend con
# `ServeDir`/`ServeFile`: sólo la feature `fs`, que es la que trae esos dos.
# `tower-http` sin features por defecto para no arrastrar compresión ni
# trazado, que aquí no se usan.
tower-http = { version = "0.6.11", default-features = false, features = ["fs"] }

# SQLite con `runtime-tokio` (el runtime de la app), `sqlite` (el driver),
# `migrate` (el migrador embebido) y `macros` (`sqlx::migrate!()` lee
# `backend/migrations/` en tiempo de compilación).
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# D-Bus directo contra `org.freedesktop.systemd1` del bus **de usuario**.
# `default-features = false` deja fuera el transporte `async-io` y deja sólo el
# de tokio, que es el runtime de este proceso: con los dos encendidos se compila
# un transporte que nunca se usa.
zbus = { version = "5.14.0", default-features = false, features = ["tokio"] }

# `StreamExt::next()` sobre el `SignalStream` con el que se espera el fin de un
# job de systemd (`JobRemoved`). Es un método de trait, así que la dependencia
# transitiva de `zbus` no basta: el trait tiene que estar en el ámbito por su
# nombre.
futures-util = "0.3.34"

# ── Registros de contenedor (change `registros-de-quadlets`) ─────────────────
#
# Los logs del contenedor de una quadlet se leen de la **API de Podman por su
# socket unix**, no con shell-out (`podman logs`) ni con el journal: es la vía
# alineada con la política del proyecto —sin depender de binarios— y la que da
# control total del stream. El cliente se escribe a mano sobre `hyper` en vez de
# arrastrar `bollard` (árbol de dependencias tres veces mayor: 146 paquetes
# frente a 51, medido offline).
#
# `hyper` sólo con las features que se usan: `client` e `http1`. La `http2` y el
# servidor no hacen falta —el servidor lo pone axum—.
hyper = { version = "1.12.0", features = ["client", "http1"] }
# `hyperlocal` es el conector por socket unix de hyper: aporta `UnixConnector` y
# el `Uri` que traduce `(socket, ruta)` a un URI que hyper entiende.
# `default-features = false` deja fuera la mitad de servidor, que no se usa.
hyperlocal = { version = "0.9.1", default-features = false, features = ["client"] }
# El `Client` de hyper-util: `client-legacy` trae el cliente HTTP/1.1 con pool de
# conexiones, `http1` el protocolo y `tokio` el ejecutor con el que se construye.
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
# `BodyExt::frame()` es lo que permite leer el cuerpo del stream de logs **según
# llega** —no de golpe—, que es la mitad que hace posible el `follow`. Estaba en
# `dev-dependencies` para las pruebas; ahora también lo usa el código.
http-body-util = "0.1.5"

# ── Autenticación OIDC (change `autenticacion-oidc`) ─────────────────────────
#
# El flujo OIDC se escribe a mano —patrón de kesto— y no con `openidconnect` ni
# `tower-sessions`: ninguna de las dos está en la caché de Cargo de esta máquina
# y este repositorio tiene que poder compilarse sin conexión. Cada versión de
# abajo es la que ya está en la caché (`~/.cargo/registry`), resuelta contra
# ella y no por reputación.
#
# `zeroize`: el secreto de firma de la sesión y el `client_secret` del proveedor
# viven en un `SecretString` que se borra de memoria al caer y no se imprime.
zeroize = "1.9.1"
# `jsonwebtoken`: firma y verifica la sesión (`HS256`) y verifica el ID token del
# proveedor (`RS256` contra el JWKS). `default-features = false` lo deja sin
# backend criptográfico propio; en la línea 11.x el backend se elige por feature
# y `rust_crypto` es el backend RustCrypto puro (deja fuera `aws-lc-rs`);
# `use_pem` es lo que lee las claves del JWKS del proveedor.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
# `reqwest`: descubrimiento, canje del código y JWKS. `rustls-tls` (y no el TLS
# por defecto) deja `native-tls`/OpenSSL fuera del build; `json` es lo que
# deserializa los tres documentos.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
# `axum-extra` con la feature `cookie`: `CookieJar` para leer la cookie de sesión
# en el *gate* y para emitir/borrar la del flujo de entrada.
axum-extra = { version = "0.10.3", features = ["cookie"] }
# `state` y `nonce` del flujo: 32 caracteres aleatorios por intento de entrada.
rand = "0.8.8"
# Codificación de los parámetros de la URL de autorización.
urlencoding = "2.1.3"

[dev-dependencies]
# `ServiceExt::oneshot` es lo que permite llamar al router sin abrir un puerto.
tower = { version = "0.5.3", features = ["util"] }
# Base de datos temporal por prueba: el arranque no crea directorios, así que las
# pruebas le dan uno que ya existe y que se limpia al soltarlo.
tempfile = "3"
# `libc::kill` es lo que permite mandar `SIGTERM` al proceso de verdad en la
# prueba de arranque: `Child::kill` sólo manda `SIGKILL`, y con `SIGKILL` no se
# puede medir un apagado ordenado.
libc = "0.2"
# `test-util` es lo que trae `#[tokio::test(start_paused = true)]`: con el reloj
# parado, el *debounce* del vigilante se mide sin esperar los milisegundos de
# verdad —y sin que la prueba dependa de lo que tarde la máquina—. No añade
# ninguna caja nueva: la feature sólo enciende `rt`, `sync` y `time`.
tokio = { version = "1.50.0", features = ["test-util"] }
# Proveedor OIDC falso local para las pruebas del flujo de entrada: un servidor
# HTTP de verdad en `127.0.0.1` con un puerto efímero, así que **ninguna prueba
# sale a internet**. Es el mismo arnés que usa kesto.
wiremock = "0.6.5"
# Un par RSA **real** para firmar el ID token `RS256` de verdad: lo que el
# callback verifica es la misma matemática que en producción, no una firma
# fingida. `pem` (que ya viene en los defaults de `rsa`) es lo que permite
# publicar la clave pública como JWK.
rsa = { version = "0.9.10", features = ["pem"] }
# Codificación base64url sin relleno del ID token `alg: none` que
# `test_support::proveedor_falso::token_con_alg_none` fabrica a mano (RFC 7515):
# `jsonwebtoken` no tiene esa variante en `Algorithm`, así que las tres partes se
# codifican aquí. Pinned a 0.22 porque es la única major que ya está en el árbol
# —la arrastran `jsonwebtoken` y `wiremock`—.
base64 = "0.22.1"
